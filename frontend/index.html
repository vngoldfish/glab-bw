<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>G-Labs BW</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#070a12" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #070a12;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #131726 0%, #070a12 100%);
        z-index: 99999;
      }
      .initial-loader-logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 35px rgba(168, 85, 247, 0.45);
        animation: logo-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        margin-bottom: 20px;
      }
      .initial-loader-logo svg {
        width: 32px;
        height: 32px;
        fill: #ffffff;
      }
      .initial-loader-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #ffffff;
        margin-bottom: 6px;
      }
      .initial-loader-sub {
        font-size: 12px;
        color: #94a3b8;
        font-weight: 500;
      }
      .initial-loader-spinner {
        margin-top: 24px;
        width: 24px;
        height: 24px;
        border: 2.5px solid rgba(168, 85, 247, 0.2);
        border-top-color: #a855f7;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes logo-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.85; }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="initial-loader-logo">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="initial-loader-title">G-Labs BW</div>
        <div class="initial-loader-sub">Đang khởi tạo ứng dụng…</div>
        <div class="initial-loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
