<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Auto-Reply Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070a12;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #fff 0%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            width: fit-content;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            background-color: #374151;
            border-radius: 13px;
            transition: background-color 0.2s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: white;
            top: 3px;
            left: 3px;
            transition: transform 0.2s;
        }

        input[type="checkbox"] {
            display: none;
        }

        input[type="checkbox"]:checked + .toggle-switch {
            background-color: var(--primary);
        }

        input[type="checkbox"]:checked + .toggle-switch::after {
            transform: translateX(24px);
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-color);
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
        }

        .badge-replied {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-pending {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .comment-item {
            border-bottom: 1px solid var(--card-border);
            padding: 16px 0;
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-author {
            font-weight: 600;
            color: #fff;
        }

        .comment-text {
            margin: 6px 0;
            font-size: 14px;
            color: var(--text-color);
        }

        .reply-text {
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3px solid var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <h1>Facebook Auto-Reply Configuration</h1>
            <p style="color: var(--text-muted); margin: 0 0 20px 0;">Configure automated comments reply templates and monitor incoming comments stream.</p>
        </div>

        <div class="card">
            <h2 style="margin-top: 0; font-size: 18px; font-weight: 600;">Settings</h2>
            <div class="form-group">
                <label>Auto-Reply Status</label>
                <label class="toggle-container">
                    <input type="checkbox" id="auto_reply_enabled">
                    <div class="toggle-switch"></div>
                    <span id="toggle-label">Disabled</span>
                </label>
            </div>
            <div class="form-group">
                <label for="auto_reply_template">Auto-Reply Template</label>
                <textarea id="auto_reply_template" placeholder="Enter auto-reply text here..."></textarea>
            </div>
            <button id="save-settings-btn">Save Settings</button>
        </div>

        <div class="card">
            <h2 style="margin-top: 0; font-size: 18px; font-weight: 600;">Comments Stream</h2>
            <div id="comments-container" style="max-height: 400px; overflow-y: auto;">
                <p style="color: var(--text-muted); text-align: center; padding: 20px 0;">No comments received yet. Keep this page open to stream live comments.</p>
            </div>
        </div>
    </div>

    <script>
        // Load Settings
        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                document.getElementById('auto_reply_enabled').checked = !!data.auto_reply_enabled;
                document.getElementById('auto_reply_template').value = data.auto_reply_template;
                updateToggleLabel(!!data.auto_reply_enabled);
            } catch (err) {
                console.error("Failed to load settings", err);
            }
        }

        function updateToggleLabel(checked) {
            document.getElementById('toggle-label').textContent = checked ? "Enabled" : "Disabled";
        }

        document.getElementById('auto_reply_enabled').addEventListener('change', (e) => {
            updateToggleLabel(e.target.checked);
        });

        // Save Settings
        document.getElementById('save-settings-btn').addEventListener('click', async () => {
            const auto_reply_enabled = document.getElementById('auto_reply_enabled').checked ? 1 : 0;
            const auto_reply_template = document.getElementById('auto_reply_template').value;
            
            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ auto_reply_enabled, auto_reply_template })
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    alert('Settings saved successfully!');
                }
            } catch (err) {
                console.error("Failed to save settings", err);
                alert('Error saving settings');
            }
        });

        // WebSocket comments stream
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;
        const ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            console.log('Connected to Comments stream WebSocket');
        };

        const commentsMap = new Map();

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                const action = data.event || data.action;

                if (action === 'fb_post_comments') {
                    const comments = data.comments || [];
                    const container = document.getElementById('comments-container');
                    
                    if (comments.length > 0 && container.querySelector('p')) {
                        container.innerHTML = '';
                    }

                    const settingsEnabled = document.getElementById('auto_reply_enabled').checked;
                    const defaultReply = document.getElementById('auto_reply_template').value;

                    comments.forEach(c => {
                        const key = c.comment_id;
                        let replied = settingsEnabled;
                        let replyText = settingsEnabled ? defaultReply : '';
                        
                        if (commentsMap.has(key)) {
                            const old = commentsMap.get(key);
                            replied = old.replied || replied;
                            replyText = old.replyText || replyText;
                        }

                        commentsMap.set(key, { ...c, replied, replyText });
                    });

                    renderComments();
                } else if (action === 'reply_comment') {
                    const key = data.comment_id;
                    if (commentsMap.has(key)) {
                        const old = commentsMap.get(key);
                        commentsMap.set(key, { ...old, replied: true, replyText: data.reply_text });
                        renderComments();
                    } else {
                        commentsMap.set(key, {
                            comment_id: data.comment_id,
                            author: data.author,
                            comment_text: data.comment_text,
                            replied: true,
                            replyText: data.reply_text
                        });
                        renderComments();
                    }
                }
            } catch (err) {
                console.error("Error processing websocket message", err);
            }
        };

        function renderComments() {
            const container = document.getElementById('comments-container');
            container.innerHTML = '';
            
            if (commentsMap.size === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 20px 0;">No comments received yet.</p>`;
                return;
            }

            Array.from(commentsMap.values()).reverse().forEach(c => {
                const div = document.createElement('div');
                div.className = 'comment-item';
                
                const badgeClass = c.replied ? 'badge badge-replied' : 'badge badge-pending';
                const badgeText = c.replied ? `Replied: ${c.replyText || 'Done'}` : 'Pending Reply';
                
                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <span class="comment-author">${c.author || 'Anonymous'}</span>
                        <span class="${badgeClass}">${badgeText}</span>
                    </div>
                    <p class="comment-text">${c.comment_text || ''}</p>
                    ${c.replied ? `<div class="reply-text"><b>Reply:</b> ${c.replyText}</div>` : ''}
                `;
                container.appendChild(div);
            });
        }

        // Initialize on load
        loadSettings();
    </script>
</body>
</html>
